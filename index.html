ion='Toate',type='Toate',editing=null,draft=null;const orders={'Cofetărie':['Muffins','Prăjituri','CakePops','Tarte','Cheesecake','Ciocolată - Dubai'],'Patiserie':['Plăcinte','Cinnamon Rolls','Biscuiți']};function sectionsRender(){sections.innerHTML=['Toate','Cofetărie','Patiserie','Meniu de Crăciun'].map(x=>`<button type="button" class="filter ${x===section?'active':''}" onclick="section='${x}';type='Toate';sectionsRender();typesRender();render()">${x}</button>`).join('')}function selectSubcategory(value){type=value;typesRender();render()}function typesRender(){if(section==='Meniu de Crăciun'){subcategoryLabel.style.display='none';types.style.display='none';types.innerHTML='';return}subcategoryLabel.style.display='block';types.style.display='flex';let a=section==='Toate'?['Toate',...orders.Cofetărie,...orders.Patiserie]:['Toate',...(orders[section]||[])];types.innerHTML=a.map(x=>`<button type="button" class="filter ${x===type?'active':''}" data-subcategory="${x}">${x}</button>`).join('');types.querySelectorAll('[data-subcategory]').forEach(button=>button.addEventListener('click',()=>selectSubcategory(button.dataset.subcategory)))}function render(){const a=products.filter(p=>(section==='Toate'||p.section===section)&&(section==='Meniu de Crăciun'||type==='Toate'||p.type===type));result.textContent=a.length+' produse afișate';if(!a.length){grid.innerHTML='<article class="card"><div class="pic"><div class="placeholder">Produsele vor fi adăugate ulterior</div></div></article>';return}grid.innerHTML=a.map(p=>`<article class="card"><div class="pic">${p.image?`<img src="${p.image}" style="transform:scale(${p.zoom});object-position:${p.x}% ${p.y}%">`:`<div class="placeholder">＋<br>${p.name}<br>Fotografie în curând</div>`}<button class="edit" onclick="openEditor(${p.id})"></button></div><div class="body"><div class="type">${p.section}${p.type?' · '+p.type:''}</div><h3>${p.name}</h3><div class="price">${p.price}</div><button class="add ${cart.includes(p.id)?'added':''}" onclick="toggle(${p.id})">${cart.includes(p.id)?'Adăugat ✓':'Adaugă în selecție'}</button></div></article>`).join('')}function toggle(id){cart=cart.includes(id)?cart.filter(x=>x!==id):[...cart,id];count.textContent=cart.length;render();renderCart()}function renderCart(){const a=products.filter(p=>cart.includes(p.id));items.innerHTML=a.length?a.map(p=>`<div class="item"><b>${p.name}</b><button class="remove" onclick="toggle(${p.id})">Șterge</button></div>`).join(''):'Selecția este goală.'}function openCart(){renderCart();drawer.classList.add('open')}function closeCart(){drawer.classList.remove('open')}function openEditor(id){editing=id;draft={...products.find(p=>p.id===id)};editName.textContent=draft.name;previewImg.src=draft.image||'';zoom.value=Math.round(draft.zoom*100);updatePreview();modal.classList.add('open')}function closeEditor(){modal.classList.remove('open')}function updatePreview(){previewImg.style.transform=`scale(${zoom.value/100})`;previewImg.style.objectPosition=`${draft.x}% ${draft.y}%`;zoomText.textContent=zoom.value+'%'}zoom.oninput=updatePreview;file.onchange=e=>{const r=new FileReader();r.onload=()=>{draft.image=r.result;previewImg.src=r.result;draft.x=50;draft.y=50;zoom.value=100;updatePreview()};if(e.target.files[0])r.readAsDataURL(e.target.files[0])};let ds=null;preview.onpointerdown=e=>{if(!draft.image)return;preview.setPointerCapture(e.pointerId);ds={x:e.clientX,y:e.clientY,bx:draft.x,by:draft.y}};preview.onpointermove=e=>{if(!ds)return;const r=preview.getBoundingClientRect();draft.x=Math.max(0,Math.min(100,ds.bx+(e.clientX-ds.x)/r.width*100));draft.y=Math.max(0,Math.min(100,ds.by+(e.clientY-ds.y)/r.height*100));updatePreview()};preview.onpointerup=()=>ds=null;function saveEdit(){const p=products.find(p=>p.id===editing);p.image=draft.image;p.zoom=zoom.value/100;p.x=draft.x;p.y=draft.y;closeEditor();render()}function sendWhatsApp(){const a=products.filter(p=>cart.includes(p.id)).map((p,i)=>`${i+1}. ${p.name}`).join('\n');window.open('https://wa.me/40738091786?text='+encodeURIComponent(`Bună! Am selectat:\n${a}`),'_blank')}function downloadPage(){try{const savedProducts=JSON.stringify(products);const clone=document.documentElement.cloneNode(true);clone.querySelectorAll('.drawer,.modal').forEach(el=>el.classList.remove('open'));const script=clone.querySelector('script');if(!script)throw new Error('Scriptul paginii nu a fost găsit.');let code=script.textContent;const begin=code.indexOf('const products=');const finish=code.indexOf(';let cart=',begin);if(begin<0||finish<0)throw new Error('Lista produselor nu a fost găsită.');code=code.slice(0,begin)+'const products='+savedProducts+code.slice(finish);script.textContent=code;const output='<!doctype html>\n'+clone.outerHTML;const blob=new Blob([output],{type:'text/html;charset=utf-8'});const link=document.createElement('a');const stamp=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);link.href=URL.createObjectURL(blob);link.download='TAGZ_brosura_salvata_'+stamp+'.html';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),2000);const photoCount=products.filter(p=>p.image&&p.image.startsWith('data:image')).length;alert('Pagina a fost salvată definitiv. Fotografii incluse în HTML: '+photoCount+'. Deschide fișierul nou descărcat pentru verificare.')}catch(error){alert('Salvarea nu a reușit: '+error.message)}}sectionsRender();typesRender();render();</script></body></html>
