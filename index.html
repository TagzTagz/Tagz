e';const orders={'Cofetărie':['Muffins','Prăjituri','CakePops','Tarte','Cheesecake','Ciocolată - Dubai'],'Patiserie':['Plăcinte','Cinnamon Rolls','Biscuiți']};function sectionsRender(){sections.innerHTML=['Toate','Cofetărie','Patiserie','Meniu de Crăciun'].map(x=>`<button type="button" class="filter ${x===section?'active':''}" onclick="section='${x}';type='Toate';sectionsRender();typesRender();render()">${x}</button>`).join('')}function selectSubcategory(value){type=value;typesRender();render()}function typesRender(){if(section==='Meniu de Crăciun'){subcategoryLabel.style.display='none';types.style.display='none';types.innerHTML='';return}subcategoryLabel.style.display='block';types.style.display='flex';let a=section==='Toate'?['Toate',...orders.Cofetărie,...orders.Patiserie]:['Toate',...(orders[section]||[])];types.innerHTML=a.map(x=>`<button type="button" class="filter ${x===type?'active':''}" data-subcategory="${x}">${x}</button>`).join('');types.querySelectorAll('[data-subcategory]').forEach(button=>button.addEventListener('click',()=>selectSubcategory(button.dataset.subcategory)))}function render(){const a=products.filter(p=>(section==='Toate'||p.section===section)&&(section==='Meniu de Crăciun'||type==='Toate'||p.type===type));result.textContent=a.length+' produse afișate';if(!a.length){grid.innerHTML='<article class="card"><div class="pic"><div class="placeholder">Produsele vor fi adăugate ulterior</div></div></article>';return}grid.innerHTML=a.map(p=>`<article class="card"><div class="pic">${p.image?`<img src="${p.image}" style="transform:scale(${p.zoom});object-position:${p.x}% ${p.y}%">`:`<div class="placeholder">＋<br>${p.name}<br>Adaugă fotografia</div>`}</div><div class="body"><div class="type">${p.section}${p.type?' · '+p.type:''}</div><h3>${p.name}</h3><div class="price">${p.price}</div>${cart[p.id]?`<div class="card-qty"><button type="button" onclick="changeQty(${p.id},-1)">−</button><span>${cart[p.id]}</span><button type="button" onclick="changeQty(${p.id},1)">+</button></div>`:`<button class="add" onclick="addOne(${p.id})">Adaugă în selecție</button>`}</div></article>`).join('')}function updateCount(){count.textContent=Object.values(cart).reduce((sum,qty)=>sum+qty,0)}function addOne(id){cart[id]=(cart[id]||0)+1;updateCount();render();renderCart()}function changeQty(id,delta){const next=(cart[id]||0)+delta;if(next<=0)delete cart[id];else cart[id]=next;updateCount();render();renderCart()}function renderCart(){const a=products.filter(p=>cart[p.id]);items.innerHTML=a.length?a.map(p=>`<div class="item"><b>${p.name}</b><div class="qty"><button type="button" aria-label="Scade cantitatea pentru ${p.name}" onclick="changeQty(${p.id},-1)">−</button><span class="qty-number">${cart[p.id]}</span><button type="button" aria-label="Crește cantitatea pentru ${p.name}" onclick="changeQty(${p.id},1)">+</button></div></div>`).join(''):'Selecția este goală.'}function openCart(){renderCart();drawer.classList.add('open')}function closeCart(){drawer.classList.remove('open')}function sendWhatsApp(){const a=products.filter(p=>cart[p.id]).map((p,i)=>`${i+1}. ${p.name} x ${cart[p.id]}`).join('\n');const details=`Bună! Am selectat:\n${a}\nData: ${date.value||'-'}\nObservații: ${notes.value||'-'}`;window.open('https://wa.me/40738091786?text='+encodeURIComponent(details),'_blank')}sectionsRender();typesRender();render();</script></body></html>
